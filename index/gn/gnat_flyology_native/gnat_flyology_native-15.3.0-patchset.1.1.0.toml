name = "gnat_flyology_native"
version = "15.3.0-patchset.1.1.0"
provides = ["gnat=15.3.0"]
description = "GNAT native compiler with a validated gnat-patches aggregate"
maintainers = ["Yurii Rashkovskii <yrashk@gmail.com>"]
maintainers-logins = ["yrashk"]
licenses = "GPL-3.0-or-later AND GPL-3.0-or-later WITH GCC-exception-3.1"
website = "https://github.com/flyology-ada/gnat-patches"

auto-gpr-with = false

[configuration]
disabled = true

[environment."case(os)".linux]
PATH.prepend = "${CRATE_ROOT}/bin"
LIBRARY_PATH.prepend = "${CRATE_ROOT}/lib64"
LD_LIBRARY_PATH.prepend = "${CRATE_ROOT}/lib64"
LD_RUN_PATH.prepend = "${CRATE_ROOT}/lib64"

[environment."case(os)".macos]
PATH.prepend = "${CRATE_ROOT}/bin"
DYLD_LIBRARY_PATH.prepend = "${CRATE_ROOT}/lib"
LD_LIBRARY_PATH.prepend = "${CRATE_ROOT}/lib"
LD_RUN_PATH.prepend = "${CRATE_ROOT}/lib"

[origin."case(os)".linux."case(host-arch)".x86-64]
binary = true
url = "https://github.com/flyology-ada/gnat-patches/releases/download/patchset-1.1.0-gcc-15/gnat-flyology-native-gcc-15.3.0-patchset-1.1.0-linux-x86_64.tar.gz"
hashes = ["sha256:04a24e868fc5bad9b940332921c2c9d376202e501e304c6e782c681b8c6cdc27"]

[origin."case(os)".linux."case(host-arch)".aarch64]
binary = true
url = "https://github.com/flyology-ada/gnat-patches/releases/download/patchset-1.1.0-gcc-15/gnat-flyology-native-gcc-15.3.0-patchset-1.1.0-linux-aarch64.tar.gz"
hashes = ["sha256:9cdf74114007f91026834beee6ce2d9015a0491ba05ae6ad678541e385cd96cf"]

[origin."case(os)".macos."case(host-arch)".aarch64]
binary = true
url = "https://github.com/flyology-ada/gnat-patches/releases/download/patchset-1.1.0-gcc-15/gnat-flyology-native-gcc-15.3.0-patchset-1.1.0-macos-aarch64.tar.gz"
hashes = ["sha256:bb4b2d746ffc364c7377a9a942480601ec33890904c304bfcc55c178b1475351"]
