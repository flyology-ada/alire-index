name = "gnat_flyology_native"
version = "16.1.0-patchset.1.1.1"
provides = ["gnat=16.1.0"]
description = "GNAT native compiler with a validated gnat-patches aggregate"
maintainers = ["Yurii Rashkovskii <yrashk@gmail.com>"]
maintainers-logins = ["yrashk"]
licenses = "GPL-3.0-or-later AND GPL-3.0-or-later WITH GCC-exception-3.1"
website = "https://github.com/flyology-ada/gnat-patches"

auto-gpr-with = false

[configuration]
disabled = true

[environment."case(os)".linux]
PATH.prepend = "${CRATE_ROOT}/bin"
LIBRARY_PATH.prepend = "${CRATE_ROOT}/lib64"
LD_LIBRARY_PATH.prepend = "${CRATE_ROOT}/lib64"
LD_RUN_PATH.prepend = "${CRATE_ROOT}/lib64"

[environment."case(os)".macos]
PATH.prepend = "${CRATE_ROOT}/bin"
DYLD_LIBRARY_PATH.prepend = "${CRATE_ROOT}/lib"
LD_LIBRARY_PATH.prepend = "${CRATE_ROOT}/lib"
LD_RUN_PATH.prepend = "${CRATE_ROOT}/lib"

[origin."case(os)".linux."case(host-arch)".x86-64]
binary = true
url = "https://github.com/flyology-ada/gnat-patches/releases/download/patchset-1.1.1-gcc-16.1.0/gnat-flyology-native-gcc-16.1.0-patchset-1.1.1-linux-x86_64.tar.gz"
hashes = ["sha256:5d95bc05210b0847be3b167a57c24b4393b67716ec54dc316a77e65a0256afc9"]

[origin."case(os)".linux."case(host-arch)".aarch64]
binary = true
url = "https://github.com/flyology-ada/gnat-patches/releases/download/patchset-1.1.1-gcc-16.1.0/gnat-flyology-native-gcc-16.1.0-patchset-1.1.1-linux-aarch64.tar.gz"
hashes = ["sha256:c1bdc993740a8145ecd358ff9ad906e0607e029833c159621bf050d081b260b7"]

[origin."case(os)".macos."case(host-arch)".aarch64]
binary = true
url = "https://github.com/flyology-ada/gnat-patches/releases/download/patchset-1.1.1-gcc-16.1.0/gnat-flyology-native-gcc-16.1.0-patchset-1.1.1-macos-aarch64.tar.gz"
hashes = ["sha256:7774318f332cea26269d0794ee3e4e9651d45080c7d430bde1fc21289951d54e"]
