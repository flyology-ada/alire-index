name = "gnat_flyology_native"
version = "14.2.0-patchset.1.1.1"
provides = ["gnat=14.2.0"]
description = "GNAT native compiler with a validated gnat-patches aggregate"
maintainers = ["Yurii Rashkovskii <yrashk@gmail.com>"]
maintainers-logins = ["yrashk"]
licenses = "GPL-3.0-or-later AND GPL-3.0-or-later WITH GCC-exception-3.1"
website = "https://github.com/flyology-ada/gnat-patches"

auto-gpr-with = false

[configuration]
disabled = true

[environment."case(os)".linux]
PATH.prepend = "${CRATE_ROOT}/bin"
LIBRARY_PATH.prepend = "${CRATE_ROOT}/lib64"
LD_LIBRARY_PATH.prepend = "${CRATE_ROOT}/lib64"
LD_RUN_PATH.prepend = "${CRATE_ROOT}/lib64"

[environment."case(os)".macos]
PATH.prepend = "${CRATE_ROOT}/bin"
DYLD_LIBRARY_PATH.prepend = "${CRATE_ROOT}/lib"
LD_LIBRARY_PATH.prepend = "${CRATE_ROOT}/lib"
LD_RUN_PATH.prepend = "${CRATE_ROOT}/lib"

[origin."case(os)".linux."case(host-arch)".x86-64]
binary = true
url = "https://github.com/flyology-ada/gnat-patches/releases/download/patchset-1.1.1-gcc-14.2.0/gnat-flyology-native-gcc-14.2.0-patchset-1.1.1-linux-x86_64.tar.gz"
hashes = ["sha256:643e32ac034191f0c5aaa02797ba30d8ee42cdce8dc32dec34532fd4f9eaa45d"]

[origin."case(os)".linux."case(host-arch)".aarch64]
binary = true
url = "https://github.com/flyology-ada/gnat-patches/releases/download/patchset-1.1.1-gcc-14.2.0/gnat-flyology-native-gcc-14.2.0-patchset-1.1.1-linux-aarch64.tar.gz"
hashes = ["sha256:2e6ebc623707994c83eb9ef1f2ff25b56d16764e399fd21b5dc3c1226fe60774"]

[origin."case(os)".macos."case(host-arch)".aarch64]
binary = true
url = "https://github.com/flyology-ada/gnat-patches/releases/download/patchset-1.1.1-gcc-14.2.0/gnat-flyology-native-gcc-14.2.0-patchset-1.1.1-macos-aarch64.tar.gz"
hashes = ["sha256:4bd78cb5d488e9d504ddabc30dd7ef814b30bccdcdbb3f0801282c9cafbb5994"]
