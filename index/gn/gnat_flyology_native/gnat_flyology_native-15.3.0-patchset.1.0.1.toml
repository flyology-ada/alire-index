name = "gnat_flyology_native"
version = "15.3.0-patchset.1.0.1"
provides = ["gnat=15.3.0"]
description = "GNAT native compiler with a validated gnat-patches aggregate"
maintainers = ["Yurii Rashkovskii <yrashk@gmail.com>"]
maintainers-logins = ["yrashk"]
licenses = "GPL-3.0-or-later AND GPL-3.0-or-later WITH GCC-exception-3.1"
website = "https://github.com/flyology-ada/gnat-patches"

auto-gpr-with = false

[configuration]
disabled = true

[environment."case(os)".linux]
PATH.prepend = "${CRATE_ROOT}/bin"
LIBRARY_PATH.prepend = "${CRATE_ROOT}/lib64"
LD_LIBRARY_PATH.prepend = "${CRATE_ROOT}/lib64"
LD_RUN_PATH.prepend = "${CRATE_ROOT}/lib64"

[environment."case(os)".macos]
PATH.prepend = "${CRATE_ROOT}/bin"
DYLD_LIBRARY_PATH.prepend = "${CRATE_ROOT}/lib"
LD_LIBRARY_PATH.prepend = "${CRATE_ROOT}/lib"
LD_RUN_PATH.prepend = "${CRATE_ROOT}/lib"

[origin."case(os)".linux."case(host-arch)".x86-64]
binary = true
url = "https://github.com/flyology-ada/gnat-patches/releases/download/patchset-1.0.1-gcc-15/gnat-flyology-native-gcc-15.3.0-patchset-1.0.1-linux-x86_64.tar.gz"
hashes = ["sha256:e509e27ee753e658695fb1e169c0201c43fba466b07519707312af20716ef486"]

[origin."case(os)".linux."case(host-arch)".aarch64]
binary = true
url = "https://github.com/flyology-ada/gnat-patches/releases/download/patchset-1.0.1-gcc-15/gnat-flyology-native-gcc-15.3.0-patchset-1.0.1-linux-aarch64.tar.gz"
hashes = ["sha256:b327aa6e4d197497449ea007ea3d64cb69ec78f9e47dbcccdcf095656fc008d3"]

[origin."case(os)".macos."case(host-arch)".aarch64]
binary = true
url = "https://github.com/flyology-ada/gnat-patches/releases/download/patchset-1.0.1-gcc-15/gnat-flyology-native-gcc-15.3.0-patchset-1.0.1-macos-aarch64.tar.gz"
hashes = ["sha256:a6994cbc80f5227568f201c5fbbe38141a38fecb0706a10e1ebbfe9f48306591"]
