name = "flyology_crc"
description = "Fast CRC-16, CRC-32, and CRC-64 algorithms for Ada"
version = "0.1.1"

licenses = "MIT OR Apache-2.0"
authors = ["Yurii Rashkovskii"]
maintainers = ["Yurii Rashkovskii <yrashk@gmail.com>"]
maintainers-logins = ["yrashk"]
tags = ["ada", "crc", "checksum", "simd"]
project-files = ["flyology_crc.gpr"]

[gpr-set-externals.'case(host-arch)']
aarch64 = { FLYOLOGY_CRC_ARCH = "aarch64" }
x86-64 = { FLYOLOGY_CRC_ARCH = "x86_64" }

[gpr-set-externals.'case(os)']
macos = { FLYOLOGY_CRC_HOST_OS = "macos" }
linux = { FLYOLOGY_CRC_HOST_OS = "linux" }

[[depends-on]]
gnat = ">=13 & <17"

[origin]
commit = "a5cb23a28c2f9d1e5548cf510f5126ca5a453315"
url = "git+https://github.com/flyology-ada/flyology-crc.git"
