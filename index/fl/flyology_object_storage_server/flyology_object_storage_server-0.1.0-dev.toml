name = "flyology_object_storage_server"
description = "Supervised S3 server and management console for Flyology Object Storage"
version = "0.1.0-dev"

authors = ["Yurii Rashkovskii"]
maintainers = ["Yurii Rashkovskii <yrashk@gmail.com>"]
maintainers-logins = ["yrashk"]
licenses = "MIT OR Apache-2.0"
website = "https://github.com/flyology-ada/flyology-object-storage"
tags = ["ada", "s3", "server", "object-storage", "web"]
executables = ["flyology_object_storage_server"]

[[depends-on]]
flyology = "=0.1.1-dev"

[[depends-on]]
flyology_http = "=0.1.3-dev"

[[depends-on]]
flyology_object_storage = "=0.1.0-dev"

[[depends-on]]
flyology_object_storage_sqlite = "=0.1.0-dev"

[build-switches]
"*".ada_version = "Ada2022"
development.optimization = "Debug"
development.compile_checks = "Errors"
release.optimization = "Performance"
release.compile_checks = "Warnings"

[[actions]]
type = "test"
command = ["./tests/scripts/test.sh"]

[origin]
commit = "6ec204838a1033a48f7f9d13c83b12fdb3cf6410"
subdir = "server"
url = "git+https://github.com/flyology-ada/flyology-object-storage.git"
