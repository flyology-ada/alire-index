name = "flyology_rdf"
description = "RDF 1.2 terms, streaming Turtle/TriG parsing, canonicalization"
version = "0.1.0-dev"

authors = ["Yurii Rashkovskii"]
maintainers = ["Yurii Rashkovskii <yrashk@gmail.com>"]
maintainers-logins = ["yrashk"]
licenses = "MIT OR Apache-2.0"
website = "https://rdf.flyology.org/"
tags = ["ada", "rdf", "turtle", "trig", "parser"]
project-files = ["flyology_rdf.gpr"]

[[depends-on]]
flyology_iri = ">=0.1.1-dev & <0.2.0"

[build-switches]
"*".ada_version = "Ada2022"
development.optimization = "Debug"
development.compile_checks = "Errors"
release.optimization = "Performance"
release.compile_checks = "Warnings"

[[actions]]
type = "test"
command = ["./scripts/test.sh"]

[origin]
commit = "a8dd2f3933ec70037cebd94102f4e4d2817f4244"
url = "git+https://github.com/flyology-ada/flyology-rdf.git"
