name = "flyology_tla"
description = "TLA+ trace generation and Ada conformance replay harness"
version = "0.1.0-dev"

authors = ["Yurii Rashkovskii"]
maintainers = ["Yurii Rashkovskii <yrashk@gmail.com>"]
maintainers-logins = ["yrashk"]
licenses = "MIT OR Apache-2.0"
tags = ["ada", "tla", "tlc", "tlaps", "testing", "conformance"]
project-files = ["flyology_tla.gpr"]
executables = ["flyology-tla"]

[available.'case(os)']
'linux|macos' = true
'...' = false

[[depends-on]]
gnat = ">=13 & <17"

[[depends-on]]
flyology_json = "=0.1.0-dev"


[[actions]]
type = "test"
command = ["./scripts/test.sh"]

[build-switches]
"*" = { Compile_Checks = "warnings" }

[origin]
commit = "ffc459bc07f80d7f63540356f065aa2d6fb1be17"
url = "git+https://github.com/flyology-ada/tla.git"
