name: Check index

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: alire-index-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: alire-project/setup-alire@v6.0.0
        with:
          version: 2.1.1

      - run: alr index --add=. --name=flyology
      - run: alr index --check
      - run: alr search --crates
      - run: ./scripts/test-update-dev-origins.sh
      - run: python3 -m unittest discover -s tests -v
