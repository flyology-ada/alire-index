name: Check index

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: alire-project/setup-alire@v6.0.0
        with:
          version: 2.1.1

      - run: alr index --add=. --name=flyology
      - run: alr index --check
      - run: alr search --crates
      - run: ./scripts/test-update-dev-origins.sh
