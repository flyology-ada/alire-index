name: Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build crate catalog
    runs-on: ubuntu-latest
    concurrency:
      group: alire-index-pages-build
      cancel-in-progress: true
    steps:
      - name: Check out index
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Check out website kit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: flyology-ada/website-kit
          ref: bd3bd1253872c731ae77fd57bd62f7fedc022378
          path: vendor/website-kit
          persist-credentials: false
      - name: Check out Alire community index
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: alire-project/alire-index
          path: vendor/alire-community-index
          fetch-depth: 0
          persist-credentials: false
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Install site generator dependencies
        run: python3 -m pip install --requirement requirements-site.txt
      - name: Test generator
        run: python3 -m unittest discover -s tests -v
      - name: Build site
        run: ./scripts/build-site.sh
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: build/site

  deploy:
    name: Publish crate catalog
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: alire-index-pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
