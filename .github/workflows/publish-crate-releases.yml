name: Publish crate releases

on:
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-crate-releases
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: alire-project/setup-alire@fc4c8ce471aa30b3af0d39ce15add1ee9eaf28f2 # v6.0.0
        with:
          version: 2.1.1
      - name: Publish tagged releases
        run: |
          git config user.name "flyology index automation"
          git config user.email "yrashk@users.noreply.github.com"
          ./scripts/update-dev-origins.sh --releases-only --push
